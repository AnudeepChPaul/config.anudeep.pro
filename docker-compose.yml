# Pinned so the project identity does not follow the directory name.
name: config-anudeep-pro

services:
  # The service itself, for local work: `docker compose up app`, then open
  # http://localhost:8200. A sample repository is seeded into the volume by `make seed`.
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        # Passed by `make up` / `make dev`; empty elsewhere, and the footer then shows the
        # version alone rather than a commit nobody can trust.
        BUILD_SHA: ${BUILD_SHA:-}
    environment:
      CONFIG_ENVIRONMENT: dev
      CONFIG_LOG_LEVEL: debug
      CONFIG_REPO_DIR: /var/lib/config/repo
      CONFIG_SOCKET_PATH: /run/config/config.sock
      CONFIG_SNAPSHOT_PATH: /var/lib/config/snapshot.json
      CONFIG_HTTP_HOST: 0.0.0.0
      CONFIG_AGE_KEY: ${CONFIG_AGE_KEY:-}
      # Signing key for the session cookie. Its presence is what turns the guard on.
      CONFIG_SESSION_SECRET: ${CONFIG_SESSION_SECRET:-}
      # The console is reached over plain http here. Refused in prod whatever is set: a session
      # cookie that can travel in the clear is not a session.
      CONFIG_INSECURE_COOKIE: "1"
      # How reachability is decided. From this container, the host's IAM is not 127.0.0.1.
      # Default talks to IAM on the Docker host. Point at a dead URL to force break-glass.
      CONFIG_IAM_HEALTH_URL: ${CONFIG_IAM_HEALTH_URL:-http://host.docker.internal:8000/healthz}
      CONFIG_IAM_CHECK_INTERVAL_MS: ${CONFIG_IAM_CHECK_INTERVAL_MS:-10000}
      CONFIG_IAM_ISSUER: ${CONFIG_IAM_ISSUER:-}
      CONFIG_IAM_CLIENT_ID: ${CONFIG_IAM_CLIENT_ID:-}
      CONFIG_IAM_CLIENT_SECRET: ${CONFIG_IAM_CLIENT_SECRET:-}
      CONFIG_IAM_REDIRECT_URI: ${CONFIG_IAM_REDIRECT_URI:-}
      # mkcert root CA so fetch('https://iam.anudeep.pro/...') trusts local TLS. Unset, the
      # mount is a dummy file and this variable is absent.
      NODE_EXTRA_CA_CERTS: ${CONFIG_IAM_TLS_CA:+/run/certs/iam-rootCA.pem}
      # Where publishes are pushed. Unset, the registry is local-only: every publish commits and
      # is served, and the console says so — "not yet pushed to GitHub" — rather than pretending.
      CONFIG_GIT_REMOTE: ${CONFIG_GIT_REMOTE:-}
      # A deploy key for that one repository, write-scoped and revocable in a click. Set
      # CONFIG_DEPLOY_KEY to its path on the host; the mount below is what puts it in here.
      CONFIG_GIT_SSH_KEY: ${CONFIG_GIT_REMOTE:+/run/secrets/deploy_key}
      CONFIG_GIT_KNOWN_HOSTS: /app/deploy/github_known_hosts
      # Where the repository lives in a browser, for linking the commit being served. Derived
      # from the remote when one is set; settable alone, since linking is a read and needs
      # neither a key nor a push.
      CONFIG_REPO_WEB_URL: ${CONFIG_REPO_WEB_URL:-}
      # The settings page: a map of how this service is configured, so it is off unless the
      # deployment says otherwise, and then only for a break-glass session or a named address.
      # Compose passes only what is declared here — an undeclared variable is simply absent
      # inside the container, however carefully .env sets it.
      CONFIG_ENABLE_SETTINGS: ${CONFIG_ENABLE_SETTINGS:-}
      CONFIG_SETTINGS_ALLOW: ${CONFIG_SETTINGS_ALLOW:-}
      # This service's log Postgres, not IAM's. Hostname `log-db` is the compose service below.
      # From the host the same database is postgresql://config:config@127.0.0.1:5435/log.
      CONFIG_LOG_DATABASE_URL: postgresql://config:config@log-db:5432/log
    depends_on:
      log-db:
        condition: service_healthy
    volumes:
      - ./src:/app/src:ro
      # compile-eta writes registry.ts here; the rest of src stays read-only.
      - ./src/views/generated:/app/src/views/generated
      - ./scripts:/app/scripts:ro
      # Baked into the image at build; without this mount, `pnpm dev` keeps the image's
      # package.json while src/ already reflects the checkout.
      - ./package.json:/app/package.json:ro
      - ./deploy:/app/deploy:ro
      # Read-only, and the default is a path that does not exist — with no remote configured
      # nothing reads it. Docker creates a directory for a missing source, which ssh rejects as
      # a key file, so an unset CONFIG_DEPLOY_KEY fails at the push and not silently.
      - ${CONFIG_DEPLOY_KEY:-./deploy/no-deploy-key}:/run/secrets/deploy_key:ro
      - ${CONFIG_IAM_TLS_CA:-./deploy/local-iam-caddy/absent-ca.pem}:/run/certs/iam-rootCA.pem:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      - config_repo:/var/lib/config
      - config_socket:/run/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
      # Browser and discovery use https://iam.anudeep.pro; inside the container that name
      # must be the host, where Caddy listens on 443.
      - "iam.anudeep.pro:host-gateway"
      - "config.anudeep.pro:host-gateway"
    # 127.0.0.1 explicitly: the console is session-gated, but still must not be published on
    # every interface. A bare "8200:8200" would.
    ports: ["127.0.0.1:8200:8200"]

  # `docker compose run --rm test` — the suite on Linux, where SO_PEERCRED exists.
  #
  # Not a long-running service and deliberately not part of `up`: it runs, reports, and exits.
  #
  # node_modules comes from the image and nothing is mounted over it. src is read-only except
  # generated/ (eta compile writes registry.ts). Tests and scripts are bound from the checkout.
  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    volumes:
      - ./src:/app/src:ro
      - ./src/views/generated:/app/src/views/generated
      - ./tests:/app/tests:ro
      # The dev scripts are tested too: env-keep.sh decides what survives `make reset`, and
      # getting that wrong disarms publishing without saying so.
      - ./scripts:/app/scripts:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      - ./vitest.config.ts:/app/vitest.config.ts:ro
    environment:
      CONFIG_ENVIRONMENT: test
      CONFIG_LOG_LEVEL: silent

  # Application and access logs only. Config values stay on the file database.
  log-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: config
      POSTGRES_PASSWORD: config
      POSTGRES_DB: log
    ports: ["127.0.0.1:5435:5432"]
    volumes:
      - config_log_pgdata:/var/lib/postgresql/data
      - ./sql/log/0001_log_schema.sql:/docker-entrypoint-initdb.d/0001_log_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U config -d log"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  config_repo:
  config_log_pgdata:
  # Shared with consuming services, which reach the read API at /run/config/config.sock.
  config_socket:
