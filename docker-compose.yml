# Pinned so the project identity does not follow the directory name.
name: config-anudeep-pro

services:
  # The service itself, for local work: `docker compose up app`, then open
  # http://localhost:8200. A sample repository is seeded into the volume by `make seed`.
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      CONFIG_ENVIRONMENT: dev
      CONFIG_LOG_LEVEL: debug
      CONFIG_REPO_DIR: /var/lib/config/repo
      CONFIG_SOCKET_PATH: /run/config/config.sock
      CONFIG_SNAPSHOT_PATH: /var/lib/config/snapshot.json
      # Binds inside the container; the port mapping below decides who can reach it. The UI has
      # no authentication until slice 10, which is also why CONFIG_ENVIRONMENT must stay dev.
      CONFIG_HTTP_HOST: 0.0.0.0
      CONFIG_AGE_KEY: ${CONFIG_AGE_KEY:-}
      # Signing key for the session cookie. Its presence is what turns the guard on.
      CONFIG_SESSION_SECRET: ${CONFIG_SESSION_SECRET:-}
      # How reachability is decided. Unset means "iam is up", which keeps break-glass shut;
      # point it at a dead port locally to exercise the emergency path.
      CONFIG_IAM_HEALTH_URL: ${CONFIG_IAM_HEALTH_URL:-}
      # Where publishes are pushed. Unset, the registry is local-only: every publish commits and
      # is served, and the console says so — "not yet pushed to GitHub" — rather than pretending.
      CONFIG_GIT_REMOTE: ${CONFIG_GIT_REMOTE:-}
      # A deploy key for that one repository, write-scoped and revocable in a click. Set
      # CONFIG_DEPLOY_KEY to its path on the host; the mount below is what puts it in here.
      CONFIG_GIT_SSH_KEY: ${CONFIG_GIT_REMOTE:+/run/secrets/deploy_key}
      CONFIG_GIT_KNOWN_HOSTS: /app/deploy/github_known_hosts
      # Where the repository lives in a browser, for linking the commit being served. Derived
      # from the remote when one is set; settable alone, since linking is a read and needs
      # neither a key nor a push.
      CONFIG_REPO_WEB_URL: ${CONFIG_REPO_WEB_URL:-}
    volumes:
      - ./src:/app/src:ro
      - ./deploy:/app/deploy:ro
      # Read-only, and the default is a path that does not exist — with no remote configured
      # nothing reads it. Docker creates a directory for a missing source, which ssh rejects as
      # a key file, so an unset CONFIG_DEPLOY_KEY fails at the push and not silently.
      - ${CONFIG_DEPLOY_KEY:-./deploy/no-deploy-key}:/run/secrets/deploy_key:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      - config_repo:/var/lib/config
      - config_socket:/run/config
    # 127.0.0.1 explicitly: an unauthenticated editor that can close registration must not be
    # reachable from the network, and a bare "8200:8200" would publish it on every interface.
    ports: ["127.0.0.1:8200:8200"]

  # `docker compose run --rm test` — the suite on Linux, where SO_PEERCRED exists.
  #
  # Not a long-running service and deliberately not part of `up`: it runs, reports, and exits.
  #
  # node_modules comes from the image and nothing is mounted over it. Only the four paths below
  # are bound, so the Linux-native koffi binary can never meet the darwin one in the host
  # checkout — which is what the named volume this used to carry was for. That volume also
  # SHADOWED the image's dependencies, so a package added on the host was missing in here even
  # after a rebuild; vitest reported the unloadable file beside a green count for everything
  # else, and a whole test file sat unrun.
  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    volumes:
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      - ./vitest.config.ts:/app/vitest.config.ts:ro
    environment:
      CONFIG_ENVIRONMENT: test
      CONFIG_LOG_LEVEL: silent

volumes:
  config_repo:
  # Shared with consuming services, which reach the read API at /run/config/config.sock.
  config_socket:
